services:
  climate-mediator:
    image: ghcr.io/didate/climate-mediator:latest
    restart: unless-stopped
    environment:
      OPENHIM_API_URL: https://openhim-api.dev.${DOMAIN}
      OPENHIM_API_USER: ${OPENHIM_USER}
      OPENHIM_API_PASSWORD: ${OPENHIM_PASSWORD}
      OPENHIM_TRUST_SELF_SIGNED: "false"
      MEDIATOR_PORT: "8002"
      MEDIATOR_URN: "urn:mediator:climate-sync"
      MEDIATOR_HOST: climate.dev.${DOMAIN}
      MEDIATOR_SCHEME: https
      DHIS2_TARGET_URL: ${DHIS2_TARGET_URL}
      DHIS2_TARGET_PAT: ${DHIS2_TARGET_PAT}
      CDS_API_KEY: ${CDS_API_KEY}
      CDS_API_URL: "https://cds.climate.copernicus.eu/api"
      HAPI_FHIR_URL: https://fhir.dev.${DOMAIN}/fhir
      MAPPING_FILE: /mapping.json
      MAX_WORKERS: "5"
      OU_IDENTIFIER_SYSTEM: "urn:dhis2:entrepot:organisationUnits"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.climate-mediator.rule=Host(`climate.dev.${DOMAIN}`)"
      - "traefik.http.routers.climate-mediator.entrypoints=websecure"
      - "traefik.http.routers.climate-mediator.tls=true"
      - "traefik.http.routers.climate-mediator.tls.certresolver=letsencrypt"
      - "traefik.http.services.climate-mediator.loadbalancer.server.port=8002"

networks:
  proxy:
    external: true
